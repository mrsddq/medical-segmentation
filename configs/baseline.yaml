seed: 42

model:
  type: unet
  in_channels: 1
  out_channels: 1
  features: [64, 128, 256, 512]
  dropout: 0.2

training:
  epochs: 50
  batch_size: 8
  lr: 1.0e-4
  optimizer: adam
  scheduler: cosine
  loss: bce
  early_stopping_patience: 15

data:
  image_size: 512
  splits_dir: data/splits
  normalize: true
  augmentation:
    enabled: false

logging:
  checkpoint_dir: outputs/logs/
  metrics_path: outputs/metrics/baseline_results.csv
