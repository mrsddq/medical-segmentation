seed: 42

model:
  type: attention_unet
  in_channels: 1
  out_channels: 1
  features: [64, 128, 256, 512]
  dropout: 0.2

training:
  epochs: 100
  batch_size: 8
  lr: 1.0e-4
  optimizer: adam
  scheduler: cosine
  loss: dice_bce
  dice_weight: 0.5
  bce_weight: 0.5
  early_stopping_patience: 15

data:
  image_size: 512
  splits_dir: data/splits
  normalize: true
  augmentation:
    enabled: true
    horizontal_flip: true
    rotation_limit: 15
    elastic_transform: true

logging:
  checkpoint_dir: outputs/logs/
  metrics_path: outputs/metrics/attention_unet_results.csv
